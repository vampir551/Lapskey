[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lapskey"
version = "0.1.0"
description = "LapSKey — keyboard layout fixer for KDE Plasma on Wayland"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["evdev>=1.6"]

[project.optional-dependencies]
gui = ["PyQt6"]

[project.scripts]
lapskey = "lapskey.cli:main"

[tool.setuptools]
packages = ["lapskey"]
