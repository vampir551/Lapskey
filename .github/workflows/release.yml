name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install python-evdev
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-dev
          python -m pip install --upgrade pip
          python -m pip install evdev

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Build release archives
        run: ./scripts/build-release.sh "$GITHUB_REF_NAME"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          TITLE="LapSKey ${TAG#v}"
          NOTES=".github/release-notes/${TAG}.md"
          if [[ -f "$NOTES" ]]; then
            gh release create "$TAG" dist/* --title "$TITLE" --notes-file "$NOTES"
          else
            gh release create "$TAG" dist/* --title "$TITLE" --generate-notes
          fi
